# 一時的な調査用(WebKit で結果が描かれない原因の調査)。調べ終わったら消す
name: webkit-diag

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: 調査
        run: npx playwright test tests/e2e/zz-webkit-diag.spec.ts tests/e2e/word-detail.spec.ts --project=desktop-webkit --project=desktop-chromium --retries=0 --reporter=list
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webkit-diag
          path: web/test-results/
          retention-days: 3
