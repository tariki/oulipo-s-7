# 一時的な確認用(WebKit で結果が描かれない不具合の修正を、プルリクエストで確かめる)。確かめたら消す
name: webkit-diag

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: WebKit のE2E(すべて、やり直しなし)
        run: npx playwright test --project=desktop-webkit --retries=0 --reporter=list
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webkit-diag
          path: web/test-results/
          retention-days: 3
